<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>Chat de la iglesia · Vista de prueba</title>
<meta name="theme-color" content="#17294B">
<link rel="icon" href="../icono-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600&display=swap">
<style>
  :root { --marino:#17294B; --marino-alto:#1E3563; --grafito:#111827; --dorado:#C5A052; --dorado-claro:#E4CB8E; --dorado-texto:#8A6A24; --dorado-suave:#F4ECD9; --fondo:#F5F3EE; --sup:#FFFFFF; --sup2:#EFECE4; --texto:#111827; --texto2:#4B5563; --texto3:#6B7280; --borde:#E3DFD5; --error:#B42318; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#0B1220; --sup:#121C31; --sup2:#18243D; --texto:#EEF1F6; --texto2:#C3CAD6; --texto3:#98A2B3; --borde:#26344F; --dorado-texto:#D7B76C; --dorado-suave:#2B2618; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: Inter, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto; }

  .cab { flex: none; background: linear-gradient(180deg, var(--marino-alto), var(--marino)); color: #fff; padding: calc(env(safe-area-inset-top,0px) + 10px) 12px 0; box-shadow: inset 0 -1px 0 rgba(197,160,82,.55); }
  .cab-fila { display: flex; align-items: center; gap: 10px; }
  .volver { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: #fff; display: grid; place-items: center; }
  .cab-txt { flex: 1; min-width: 0; }
  .cab-txt b { display: block; font-family: Lora, Georgia, serif; font-size: 1.125rem; font-weight: 600; }
  .cab-txt small { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: rgba(255,255,255,.75); }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; }
  .canales { display: flex; gap: 8px; overflow-x: auto; padding: 12px 4px 12px; scrollbar-width: none; }
  .canales::-webkit-scrollbar { display: none; }
  .canal { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #fff; font-size: .875rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .canal[aria-pressed="true"] { background: var(--dorado); color: var(--grafito); border-color: var(--dorado); }
  .canal .n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E5484D; color: #fff; font-size: .7rem; display: inline-grid; place-items: center; }

  .prueba { flex: none; margin: 10px 12px 0; padding: 8px 12px; border-radius: 12px; background: var(--dorado-suave); color: var(--dorado-texto); font-size: .8rem; font-weight: 600; text-align: center; }
  .fijado { flex: none; margin: 10px 12px 0; padding: 10px 12px; border-radius: 14px; background: var(--sup); border: 1px solid rgba(197,160,82,.45); display: flex; gap: 10px; align-items: flex-start; font-size: .875rem; }
  .fijado .ic { color: var(--dorado-texto); width: 18px; height: 18px; margin-top: 1px; }
  .fijado b { display: block; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--dorado-texto); }

  .mensajes { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 4px; overscroll-behavior: contain; }
  .dia { align-self: center; margin: 10px 0 6px; padding: 4px 12px; border-radius: 999px; background: var(--sup2); color: var(--texto2); font-size: .75rem; font-weight: 600; }
  .msg { max-width: 82%; display: flex; gap: 8px; align-items: flex-end; }
  .msg + .msg.mismo { margin-top: -1px; }
  .av { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; color: #fff; }
  .msg.mismo .av { visibility: hidden; }
  .burbuja { padding: 8px 12px 6px; border-radius: 18px 18px 18px 6px; background: var(--sup); border: 1px solid var(--borde); line-height: 1.45; font-size: .9375rem; overflow-wrap: anywhere; position: relative; }
  .autor { display: block; font-size: .78rem; font-weight: 700; margin-bottom: 2px; }
  .msg.mismo .autor { display: none; }
  .rol { margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--dorado-suave); color: var(--dorado-texto); font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; vertical-align: 1px; }
  .hora { display: block; text-align: right; font-size: .68rem; color: var(--texto3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mio { align-self: flex-end; flex-direction: row-reverse; }
  .mio .av { display: none; }
  .mio .burbuja { background: var(--marino); color: #fff; border-color: var(--marino); border-radius: 18px 18px 6px 18px; }
  .mio .hora { color: rgba(255,255,255,.65); }
  .mio .autor { display: none; }
  .reacc { position: absolute; bottom: -12px; right: 10px; padding: 1px 6px; border-radius: 999px; background: var(--sup); border: 1px solid var(--borde); font-size: .75rem; color: var(--texto2); }
  .msg.con-reacc { margin-bottom: 12px; }
  .borrado .burbuja { font-style: italic; color: var(--texto3); background: transparent; }

  .redactar { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px calc(env(safe-area-inset-bottom,0px) + 10px); background: var(--sup); border-top: 1px solid var(--borde); }
  .redactar textarea { flex: 1; min-height: 44px; max-height: 120px; resize: none; padding: 11px 14px; border-radius: 22px; border: 1px solid var(--borde); background: var(--fondo); font-size: 1rem; line-height: 1.35; }
  .redactar textarea:focus { outline: 2px solid var(--dorado); outline-offset: 0; }
  .enviar { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--dorado); color: var(--grafito); display: grid; place-items: center; }
  .enviar:disabled { opacity: .45; }

  .menu { position: fixed; inset: 0; z-index: 30; background: rgba(11,18,32,.45); display: flex; align-items: flex-end; justify-content: center; }
  .menu-in { width: 100%; max-width: 640px; background: var(--sup); border-radius: 20px 20px 0 0; padding: 10px 12px calc(env(safe-area-inset-bottom,0px) + 14px); }
  .menu-in p { margin: 6px 8px 10px; color: var(--texto2); font-size: .85rem; }
  .menu-in button { width: 100%; min-height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; background: none; border-radius: 12px; text-align: left; font-size: 1rem; }
  .menu-in button:active { background: var(--sup2); }
  .menu-in .peligro { color: var(--error); }
  .reacciones { display: flex; justify-content: space-around; padding: 4px 0 8px; }
  .reacciones button { width: 52px; height: 52px; justify-content: center; font-size: 1.6rem; padding: 0; }
</style>
</head>
<body>
<div class="app">
  <header class="cab">
    <div class="cab-fila">
      <a class="volver" href="../" aria-label="Volver a la app"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
      <div class="cab-txt"><b>Chat de la iglesia</b><small><span class="punto" aria-hidden="true"></span><span id="enLinea">23 hermanos en línea</span></small></div>
    </div>
    <div class="canales" role="group" aria-label="Grupos" id="canales"></div>
  </header>
  <p class="prueba">Vista de prueba · los mensajes no se guardan ni los ve nadie más</p>
  <div class="fijado" id="fijado"></div>
  <div class="mensajes" id="mensajes" aria-live="polite"></div>
  <form class="redactar" id="form">
    <textarea id="texto" rows="1" placeholder="Escribe un mensaje…" aria-label="Mensaje" maxlength="500"></textarea>
    <button class="enviar" type="submit" id="enviar" aria-label="Enviar" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
  </form>
</div>
<div class="menu" id="menu" hidden>
  <div class="menu-in" role="dialog" aria-label="Opciones del mensaje">
    <div class="reacciones" id="reacciones"></div>
    <p id="menuInfo"></p>
    <button type="button" data-acc="responder"><svg class="ic" viewBox="0 0 24 24"><path d="m9 17-5-5 5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>Responder</button>
    <button type="button" data-acc="reportar"><svg class="ic" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 8 2a6 6 0 0 0 3.6-1.2A1 1 0 0 1 20 3.6V15a1 1 0 0 1-.4.8A6 6 0 0 1 16 17c-3 0-5-2-8-2a6 6 0 0 0-4 1.5"/></svg>Reportar al administrador</button>
    <button type="button" data-acc="borrar" class="peligro"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Borrar mensaje (administrador)</button>
    <button type="button" data-acc="cerrar">Cancelar</button>
  </div>
</div>
<script>
(function () {
  var COLORES = ['#17294B', '#8A6A24', '#2F7A52', '#7C3A8C', '#B4532A', '#2563A8'];
  var CANALES = [
    { id: 'general', nombre: 'General', fijado: ['Normas del chat', 'Escribimos con respeto y amor fraternal. Solo miembros registrados con su nombre real. Los mensajes fuera de lugar se borran.'] },
    { id: 'oracion', nombre: 'Oración', nuevos: 3, fijado: ['Para orar unos por otros', 'Comparte tu motivo; los hermanos te acompañan en oración. Para algo privado, usa la sección Oración.'] },
    { id: 'jovenes', nombre: 'Jóvenes', nuevos: 5, fijado: ['Grupo de jóvenes', 'Reunión los sábados de 17:00 a 19:30 en el templo.'] },
    { id: 'coro', nombre: 'Coro', fijado: ['Coro', 'Ensayo general: viernes 30 a las 20:00.'] },
    { id: 'dorcas', nombre: 'Dorcas', fijado: ['Dorcas', 'Convención de Dorcas: 13, 14 y 15 de noviembre.'] }
  ];
  var EJ = {
    general: [
      ['Hno. Pastor', 'Pastor', 'Bendiciones, hermanos. Mañana miércoles hay culto de la Semana de Dorcas a las 19:30. ¡Los esperamos!', '18:02', '🙏 12'],
      ['Hna. Marta', '', 'Amén, pastor. Allí estaremos con la familia.', '18:10'],
      ['Hno. Luis', '', '¿El sábado el desfile sale desde el templo?', '18:25'],
      ['Hno. Andrés', 'Diácono', 'Sí, hermano. Salimos a las 16:00 y a las 18:00 es el gran culto de celebración.', '18:31', '👍 4'],
      ['Hna. Carmen', '', 'Gracias por la información 🙌', '18:40']
    ],
    oracion: [
      ['Hna. Rosa', '', 'Hermanos, pido oración por mi mamá que está delicada de salud.', '09:15', '🙏 18'],
      ['Hno. Pedro', '', 'Estamos orando, hermana. Dios tiene el control.', '09:22'],
      ['Hna. Ana', '', 'Doy gracias a Dios porque encontré trabajo. ¡Gracias por sus oraciones!', '12:40', '🙌 21']
    ],
    jovenes: [
      ['Hno. Diego', 'Líder', 'Jóvenes, este sábado ensayamos para el desfile. Lleguen 16:45.', '20:05', '🔥 9'],
      ['Hna. Javiera', '', '¡Listo! Llevo los parlantes.', '20:12'],
      ['Hno. Matías', '', 'Yo llego un poco tarde, salgo de clases a las 17:00.', '20:20']
    ],
    coro: [
      ['Hna. Directora', 'Directora', 'Coro: el viernes repasamos «Firmes y adelante» y el himno de la convención.', '19:00'],
      ['Hno. Jorge', '', '¿Hay que llevar la carpeta nueva?', '19:12']
    ],
    dorcas: [
      ['Hna. Presidenta', 'Presidenta', 'Hermanas, el lunes clase de Dorcas a las 14:00. Traigan sus materiales.', '10:00', '❤️ 7']
    ]
  };
  var YO = 'Hno. Rudy Fuentes';
  var actual = 'general', seleccionado = null;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function iniciales(n) { return n.replace(/^Hn[oa]\.\s*/, '').split(/\s+/).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase(); }
  function color(n) { var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; return COLORES[h % COLORES.length]; }

  function dibujarCanales() {
    $('canales').innerHTML = CANALES.map(function (c) {
      return '<button type="button" class="canal" data-canal="' + c.id + '" aria-pressed="' + (c.id === actual) + '">' + esc(c.nombre) + (c.nuevos && c.id !== actual ? '<span class="n">' + c.nuevos + '</span>' : '') + '</button>';
    }).join('');
    $('canales').querySelectorAll('[data-canal]').forEach(function (b) { b.onclick = function () { actual = b.dataset.canal; CANALES.forEach(function (c) { if (c.id === actual) c.nuevos = 0; }); dibujarCanales(); dibujar(); }; });
  }
  function dibujar() {
    var c = CANALES.filter(function (x) { return x.id === actual; })[0];
    $('fijado').innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg><div><b>' + esc(c.fijado[0]) + '</b>' + esc(c.fijado[1]) + '</div>';
    var lista = EJ[actual], previo = null;
    $('mensajes').innerHTML = '<span class="dia">Hoy</span>' + lista.map(function (m, i) {
      var mio = m.mio, mismo = previo === m[0]; previo = m[0];
      return '<div class="msg' + (mio ? ' mio' : '') + (mismo ? ' mismo' : '') + (m[4] ? ' con-reacc' : '') + (m.borrado ? ' borrado' : '') + '" data-i="' + i + '">' +
        '<span class="av" style="background:' + color(m[0]) + '" aria-hidden="true">' + esc(iniciales(m[0])) + '</span>' +
        '<div class="burbuja"><span class="autor" style="color:' + color(m[0]) + '">' + esc(m[0]) + (m[1] ? '<span class="rol">' + esc(m[1]) + '</span>' : '') + '</span>' +
        (m.borrado ? 'Mensaje borrado por el administrador' : esc(m[2])) + '<span class="hora">' + esc(m[3]) + '</span>' + (m[4] ? '<span class="reacc">' + esc(m[4]) + '</span>' : '') + '</div></div>';
    }).join('');
    $('mensajes').querySelectorAll('.msg').forEach(function (el) { el.onclick = function () { abrirMenu(+el.dataset.i); }; });
    $('mensajes').scrollTop = $('mensajes').scrollHeight;
  }
  function abrirMenu(i) {
    var m = EJ[actual][i]; if (m.borrado) return; seleccionado = i;
    $('menuInfo').textContent = m[0] + ' · ' + m[3];
    $('reacciones').innerHTML = ['🙏', '🙌', '❤️', '👍', '🔥'].map(function (e) { return '<button type="button" data-r="' + e + '" aria-label="Reaccionar ' + e + '">' + e + '</button>'; }).join('');
    $('reacciones').querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { var r = m[4] && m[4].indexOf(b.dataset.r) === 0 ? +m[4].split(' ')[1] + 1 : 1; m[4] = b.dataset.r + ' ' + r; cerrar(); dibujar(); }; });
    $('menu').hidden = false;
  }
  function cerrar() { $('menu').hidden = true; }
  $('menu').onclick = function (e) { if (e.target === $('menu')) cerrar(); };
  document.querySelectorAll('[data-acc]').forEach(function (b) {
    b.onclick = function () {
      var m = EJ[actual][seleccionado];
      if (b.dataset.acc === 'borrar') m.borrado = true;
      if (b.dataset.acc === 'responder') { $('texto').value = '@' + m[0] + ' '; $('texto').focus(); $('enviar').disabled = false; }
      if (b.dataset.acc === 'reportar') alertaSuave('Gracias. El administrador revisará el mensaje.');
      cerrar(); dibujar();
    };
  });
  function alertaSuave(t) { var p = document.createElement('p'); p.className = 'prueba'; p.textContent = t; p.style.cssText = 'position:fixed;left:12px;right:12px;bottom:90px;z-index:40;margin:0'; document.body.appendChild(p); setTimeout(function () { p.remove(); }, 2500); }
  var ta = $('texto');
  ta.addEventListener('input', function () { $('enviar').disabled = !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; });
  $('form').onsubmit = function (e) {
    e.preventDefault(); var t = ta.value.trim(); if (!t) return;
    var d = new Date(), h = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var m = [YO, '', t, h]; m.mio = true; EJ[actual].push(m);
    ta.value = ''; ta.style.height = ''; $('enviar').disabled = true; dibujar();
  };
  try { var r = JSON.parse(localStorage.getItem('registro') || 'null'); if (r && r.nombre) YO = r.nombre; } catch (e) {}
  dibujarCanales(); dibujar();
})();
</script>
</body>
</html>
